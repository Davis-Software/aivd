stages:
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  BINARY_NAME: "aivd-linux-x86_64"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aivd/${CI_COMMIT_TAG}"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:linux:
  stage: build
  # Bookworm (glibc 2.36) so the binary also runs on older distros than the newest one.
  image: python:3.12-slim-bookworm
  cache:
    key:
      files:
        - requirements.txt
        - requirements-build.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends binutils > /dev/null  # PyInstaller needs objdump
    - pip install -r requirements-build.txt
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        APP_VERSION=$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("main.py").read()).group(1))')
        if [ "v${APP_VERSION}" != "$CI_COMMIT_TAG" ]; then
          echo "Tag '$CI_COMMIT_TAG' does not match __version__ '$APP_VERSION' in main.py"
          exit 1
        fi
      fi
    - pyinstaller --noconfirm --clean aivd.spec
    - ./dist/aivd --version
    - mv dist/aivd "dist/${BINARY_NAME}"
  artifacts:
    name: "aivd-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/${BINARY_NAME}
    expire_in: 1 week

release:upload:
  stage: release
  image: curlimages/curl:latest
  needs: ["build:linux"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - >
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "dist/${BINARY_NAME}" "${PACKAGE_REGISTRY_URL}/${BINARY_NAME}"

release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["release:upload"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AIVD $CI_COMMIT_TAG"
    description: "AIVD $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${BINARY_NAME}"
          url: "${PACKAGE_REGISTRY_URL}/${BINARY_NAME}"
          link_type: package

# Publishing to GitHub needs a CI/CD variable GITHUB_TOKEN: a fine-grained GitHub token for Davis-Software/aivd with
# "Contents: Read and write". The jobs are skipped when it isn't set.
.github-release:
  stage: release
  image: alpine:3.22
  variables:
    GITHUB_REPO: "Davis-Software/aivd"
    GIT_DEPTH: "0"  # full history, so the tag can be pushed to GitHub
  before_script:
    - apk add --no-cache curl git github-cli
    - export GH_TOKEN="$GITHUB_TOKEN"
    - gh auth setup-git
  script:
    # The repository mirror may not have pushed the tag yet; pushing an identical tag is a no-op.
    - git push "https://github.com/${GITHUB_REPO}.git" "refs/tags/${TAG}"
    - |
      if gh release view "$TAG" --repo "$GITHUB_REPO" > /dev/null 2>&1; then
        gh release upload "$TAG" "dist/${BINARY_NAME}" --repo "$GITHUB_REPO" --clobber
      else
        gh release create "$TAG" "dist/${BINARY_NAME}" --repo "$GITHUB_REPO" --verify-tag \
          --title "AIVD $TAG" \
          --notes "AIVD $TAG. Also available on [GitLab](${CI_PROJECT_URL}/-/releases/${TAG})."
      fi

# Runs automatically for every new release tag, with the binary built in this pipeline.
release:github:
  extends: .github-release
  needs: ["build:linux"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $GITHUB_TOKEN
  variables:
    TAG: "$CI_COMMIT_TAG"

# Publishes a release that already exists on GitLab (e.g. one tagged before release:github existed) to GitHub,
# with the binary from its GitLab release. Start it manually in a pipeline of the default branch and set the job
# variable TAG, e.g. TAG=v3.1.0.
release:github-existing-tag:
  extends: .github-release
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITHUB_TOKEN
      when: manual
      allow_failure: true  # don't block the pipeline while it waits to be started
  script:
    - |
      if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Set the job variable TAG to the release to publish, e.g. TAG=v3.1.0 (got '${TAG}')."
        exit 1
      fi
    - git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}"
    - mkdir -p dist
    - >
      curl --fail --silent --show-error --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --output "dist/${BINARY_NAME}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aivd/${TAG}/${BINARY_NAME}"
    - !reference [.github-release, script]
